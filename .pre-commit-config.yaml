# =============================================================================
# ARIZONA LAVKA MARKETPLACE - PRE-COMMIT CONFIGURATION
# =============================================================================
# Установка: pre-commit install
# Запуск всех хуков: pre-commit run --all-files
# =============================================================================

default_language_version:
  python: python3.12
  node: 20.0.0

default_stages: [pre-commit]

fail_fast: false

repos:
  # =============================================================================
  # ОБЩИЕ ХУКИ (для всех файлов)
  # =============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Проверка синтаксиса
      - id: check-yaml
        name: Check YAML syntax
        args: [--unsafe]
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax

      # Проверка конфликтов слияния
      - id: check-merge-conflict
        name: Check merge conflicts

      # Безопасность
      - id: detect-private-key
        name: Detect private keys

      # Очистка
      - id: trailing-whitespace
        name: Remove trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: Fix end of file
        exclude: ^frontend/.*$
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]

  # =============================================================================
  # PYTHON / BACKEND ХУКИ (только backend/**)
  # =============================================================================

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.3
    hooks:
      # Линтер
      - id: ruff
        name: Ruff lint (backend)
        entry: ruff check --fix
        types_or: [python, pyi, jupyter]
        files: ^backend/
        args: [--exit-non-zero-on-fix]

      # Форматтер
      - id: ruff-format
        name: Ruff format (backend)
        types_or: [python, pyi, jupyter]
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: MyPy type check (backend)
        files: ^backend/
        exclude: ^backend/alembic/
        additional_dependencies:
          - pydantic>=2.6
          - sqlalchemy>=2.0
          - fastapi>=0.109
          - asyncpg>=0.29
          - httpx>=0.26
          - cachetools>=5.3
          - pyjwt>=2.8
          - bcrypt>=4.1
          - pydantic-settings>=2.1
        args:
          - --ignore-missing-imports
          - --disallow-untyped-defs
          - --disallow-incomplete-defs
          - --check-untyped-defs
          - --no-implicit-optional
          - --warn-redundant-casts
          - --warn-unused-ignores

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: Bandit security (backend)
        args: [-c, .bandit.yaml, -r]
        files: ^backend/

  # =============================================================================
  # FRONTEND / TYPESCRIPT ХУКИ (только frontend/**)
  # =============================================================================

  - repo: local
    hooks:
      # ESLint проверка
      - id: frontend-lint
        name: ESLint check (frontend)
        entry: npm run lint
        language: system
        types_or: [typescript, tsx]
        files: ^frontend/src/
        pass_filenames: false
        require_serial: true

      # Prettier форматирование
      - id: frontend-format
        name: Prettier format (frontend)
        entry: npx prettier --write
        language: system
        types_or: [typescript, tsx, javascript, jsx, json, css, md]
        files: ^frontend/src/
        pass_filenames: false
        require_serial: true

      # TypeScript type check
      - id: frontend-type-check
        name: TypeScript type check (frontend)
        entry: npx tsc --noEmit
        language: system
        types_or: [typescript, tsx]
        files: ^frontend/src/
        pass_filenames: false
        require_serial: true

  # =============================================================================
  # DOCKER ХУКИ
  # =============================================================================

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Dockerfile lint
        args: [--ignore, DL3008, --ignore, DL3013, --ignore, DL3003]
        files: Dockerfile$|Dockerfile\.[^/]*$
