# =============================================================================
# ARIZONA LAVKA MARKETPLACE - MAIN CI WORKFLOW
# =============================================================================
# Orchestrates all CI checks for the entire project
# =============================================================================

name: CI - All Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20.x"

jobs:
  # ===========================================================================
  # DOCKER COMPOSE VALIDATION
  # ===========================================================================
  docker-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  # ===========================================================================
  # DOCUMENTATION CHECK
  # ===========================================================================
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md || (echo "README.md not found" && exit 1)

      - name: Check LICENSE exists
        run: test -f LICENSE || (echo "LICENSE not found" && exit 1)

      - name: Check .env.example exists
        run: test -f .env.example || (echo ".env.example not found" && exit 1)

  # ===========================================================================
  # BACKEND CI
  # ===========================================================================
  backend-ci:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yaml
    needs: [docker-validate, docs-check]

  # ===========================================================================
  # FRONTEND CI
  # ===========================================================================
  frontend-ci:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yaml
    needs: [docker-validate, docs-check]

  # ===========================================================================
  # SUMMARY
  # ===========================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [docker-validate, docs-check, backend-ci, frontend-ci]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Validate | ${{ needs.docker-validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend CI | ${{ needs.backend-ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend CI | ${{ needs.frontend-ci.result }} |" >> $GITHUB_STEP_SUMMARY
