# =============================================================================
# ARIZONA LAVKA MARKETPLACE - BACKEND CI WORKFLOW
# =============================================================================
# Проверка backend кода: lint, type-check, security
# Запускается ТОЛЬКО при изменениях в backend/**
# =============================================================================

name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.bandit.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.bandit.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "latest"

jobs:
  # ===========================================================================
  # BACKEND CI - LINT, TYPE-CHECK, SECURITY
  # ===========================================================================
  backend-ci:
    name: Backend CI (Lint + Type + Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      # =======================================================================
      # UV КЭШИРОВАНИЕ - быстрая установка зависимостей
      # =======================================================================
      - name: Cache uv global cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-global-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-global-

      - name: Cache uv project venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-uv-venv-${{ hashFiles('backend/**/requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-venv-

      # =======================================================================
      # УСТАНОВКА ЗАВИСИМОСТЕЙ
      # =======================================================================
      - name: Install backend dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

      # =======================================================================
      # LINT & FORMAT (RUFF)
      # =======================================================================
      - name: Install Ruff
        run: uv pip install ruff

      - name: Run Ruff check
        run: uv run ruff check . --exit-non-zero-on-fix

      - name: Run Ruff format check
        run: uv run ruff format . --check

      # =======================================================================
      # TYPE CHECKING (MYPY)
      # =======================================================================
      - name: Install MyPy
        run: uv pip install mypy

      - name: Run MyPy type check
        run: |
          uv run mypy . \
            --ignore-missing-imports \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --check-untyped-defs \
            --no-implicit-optional \
            --warn-redundant-casts \
            --warn-unused-ignores

      # =======================================================================
      # SECURITY CHECKS (BANDIT)
      # =======================================================================
      - name: Install Bandit
        run: uv pip install bandit

      - name: Run Bandit security check
        run: uv run bandit -c ../.bandit.yaml -r .
