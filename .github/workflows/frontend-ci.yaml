# =============================================================================
# ARIZONA LAVKA MARKETPLACE - FRONTEND CI WORKFLOW
# =============================================================================
# Проверка frontend кода: lint, type-check, build
# Запускается ТОЛЬКО при изменениях в frontend/**
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.x"

jobs:
  # ===========================================================================
  # FRONTEND CI - LINT, TYPE-CHECK, BUILD
  # ===========================================================================
  frontend-ci:
    name: Frontend CI (Lint + Type + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # =======================================================================
      # NPM КЭШИРОВАНИЕ - быстрая установка зависимостей
      # =======================================================================
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # =======================================================================
      # УСТАНОВКА ЗАВИСИМОСТЕЙ
      # =======================================================================
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # =======================================================================
      # LINT (ESLint)
      # =======================================================================
      - name: Run ESLint
        run: npm run lint

      # =======================================================================
      # TYPE CHECK (TypeScript) - с учётом FSD архитектуры
      # =======================================================================
      - name: Run TypeScript type check
        run: npx tsc --noEmit

      # =======================================================================
      # FORMAT CHECK (Prettier)
      # =======================================================================
      - name: Install Prettier
        run: npm install --save-dev prettier

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css,md}"

      # =======================================================================
      # BUILD (Vite) - проверка сборки
      # =======================================================================
      - name: Create .env for build
        run: echo "VITE_API_URL=/api" > .env

      - name: Run Vite build
        run: npm run build

      # =======================================================================
      # UPLOAD ARTIFACTS
      # =======================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7
