# =============================================================================
# Arizona Lavka Marketplace - PR Validation Workflow
# =============================================================================
# This workflow runs on every Pull Request to ensure code quality and
# prevent breaking changes from being merged into main.
#
# Triggers:
#   - Pull request to main branch
#   - Pull request to develop branch (if exists)
#
# Jobs:
#   1. Backend Lint & Test - Python code quality checks
#   2. Frontend Build & TypeCheck - TypeScript validation and build
#   3. Docker Build Check - Verify Docker images build successfully
# =============================================================================

name: 🧪 PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

# Cancel previous runs if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Backend: Python Linting and Type Checking
  # ===========================================================================
  backend-lint:
    name: 🐍 Backend Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout repository
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Python with uv (lightning-fast package manager)
      - name: ⚙️ Setup Python with uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      # Step 3: Install backend dependencies
      - name: 📦 Install Dependencies
        run: |
          cd backend
          uv pip install -r requirements.txt
        shell: bash

      # Step 4: Run Ruff linter (fast, comprehensive)
      - name: 🔍 Run Ruff Linter
        run: |
          cd backend
          uv run ruff check . --output-format=github
        shell: bash
        continue-on-error: true

      # Step 5: Run Flake8 for additional style checks
      - name: 🔍 Run Flake8
        run: |
          cd backend
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        shell: bash
        continue-on-error: true

      # Step 6: Run MyPy for type checking
      - name: 🔍 Run MyPy Type Checker
        run: |
          cd backend
          uv run mypy . --ignore-missing-imports --no-error-summary
        shell: bash
        continue-on-error: true

  # ===========================================================================
  # Backend: Unit Tests (if they exist)
  # ===========================================================================
  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend-lint

    services:
      # PostgreSQL service for database tests
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arizonalavka
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: arizonalavka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Checkout repository
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Python with uv
      - name: ⚙️ Setup Python with uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.12'
          enable-cache: true

      # Step 3: Install dependencies including test tools
      - name: 📦 Install Dependencies
        run: |
          cd backend
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio pytest-cov
        shell: bash

      # Step 4: Run Pytest (if tests exist)
      - name: 🧪 Run Pytest
        run: |
          cd backend
          if [ -d "tests" ]; then
            uv run pytest tests/ -v --cov=. --cov-report=xml
          else
            echo "⚠️ No tests directory found. Skipping tests."
          fi
        shell: bash
        env:
          POSTGRES_USER: arizonalavka
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: arizonalavka_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          JWT_SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: "true"

      # Step 5: Upload coverage report
      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ===========================================================================
  # Frontend: TypeScript Check and Build
  # ===========================================================================
  frontend-build:
    name: ⚛️ Frontend Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Checkout repository
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install dependencies
      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit
        shell: bash

      # Step 4: Run ESLint
      - name: 🔍 Run ESLint
        run: |
          cd frontend
          npm run lint
        shell: bash
        continue-on-error: true

      # Step 5: Run TypeScript type checking
      - name: 🔍 Run TypeScript Type Check
        run: |
          cd frontend
          npm run type-check
        shell: bash

      # Step 6: Build Vite project
      - name: 🔨 Build Frontend
        run: |
          cd frontend
          npm run build
        shell: bash

      # Step 7: Upload build artifacts
      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ===========================================================================
  # Docker: Build Verification
  # ===========================================================================
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-lint, frontend-build]

    steps:
      # Step 1: Checkout repository
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Docker Buildx
      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build backend Docker image (no push)
      - name: 🔨 Build Backend Image
        run: |
          docker build -t arizonalavka-backend:test ./backend
        shell: bash

      # Step 4: Build frontend Docker image (no push)
      - name: 🔨 Build Frontend Image
        run: |
          docker build -t arizonalavka-frontend:test ./frontend
        shell: bash

      # Step 5: Verify docker-compose configuration
      - name: ✅ Validate Docker Compose
        run: |
          docker-compose config
        shell: bash

      # Step 6: Cleanup
      - name: 🧹 Cleanup Images
        if: always()
        run: |
          docker rmi arizonalavka-backend:test arizonalavka-frontend:test || true
        shell: bash

  # ===========================================================================
  # Summary: Job Status
  # ===========================================================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    if: always()

    steps:
      - name: 📝 Generate Summary
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Lint | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
        shell: bash
