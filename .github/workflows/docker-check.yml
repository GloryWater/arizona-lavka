# =============================================================================
# Arizona Lavka Marketplace - Docker Build Verification Workflow
# =============================================================================
# This workflow ensures that Docker images build successfully and
# the docker-compose configuration is valid.
#
# Purpose:
#   - Prevent broken Docker configurations from being merged
#   - Verify all services can be built
#   - Test Docker Compose configuration
#
# Triggers:
#   - Push to main branch
#   - Pull request to main branch
#   - Manual trigger (workflow_dispatch)
# =============================================================================

name: 🐳 Docker Build Check

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
  workflow_dispatch:

# Cancel previous runs if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Docker Compose Configuration Validation
  # ===========================================================================
  docker-compose-config:
    name: ✅ Validate Docker Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Validate docker-compose.yml
        run: |
          echo "Validating docker-compose.yml syntax..."
          docker-compose config --quiet
          echo "✅ docker-compose.yml is valid"
        shell: bash

  # ===========================================================================
  # Backend Docker Image Build
  # ===========================================================================
  backend-build:
    name: 🔨 Build Backend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-compose-config

    steps:
      # Step 1: Checkout repository
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Docker Buildx for better caching
      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build backend image with cache
      - name: 🔨 Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: arizonalavka-backend:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Step 4: Verify image was created
      - name: ✅ Verify Backend Image
        run: |
          docker images arizonalavka-backend
          IMAGE_ID=$(docker images -q arizonalavka-backend)
          if [ -z "$IMAGE_ID" ]; then
            echo "❌ Backend image was not created"
            exit 1
          fi
          echo "✅ Backend image created successfully: $IMAGE_ID"
        shell: bash

      # Step 5: Test backend container starts
      - name: 🧪 Test Backend Container
        run: |
          docker run --rm -d \
            --name backend-test \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -e POSTGRES_HOST=localhost \
            -e JWT_SECRET_KEY=test-secret-key \
            -e DEBUG=true \
            arizonalavka-backend:test-${{ github.sha }} \
            uvicorn main:app --host 0.0.0.0 --port 8000

          # Wait for container to start
          sleep 5

          # Check if container is running
          if docker ps | grep -q backend-test; then
            echo "✅ Backend container started successfully"
            docker logs backend-test --tail 20
            docker stop backend-test
          else
            echo "❌ Backend container failed to start"
            docker logs backend-test
            exit 1
          fi
        shell: bash
        continue-on-error: true

  # ===========================================================================
  # Frontend Docker Image Build
  # ===========================================================================
  frontend-build:
    name: 🔨 Build Frontend Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-compose-config

    steps:
      # Step 1: Checkout repository
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Docker Buildx
      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build frontend image with cache
      - name: 🔨 Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: arizonalavka-frontend:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Step 4: Verify image was created
      - name: ✅ Verify Frontend Image
        run: |
          docker images arizonalavka-frontend
          IMAGE_ID=$(docker images -q arizonalavka-frontend)
          if [ -z "$IMAGE_ID" ]; then
            echo "❌ Frontend image was not created"
            exit 1
          fi
          echo "✅ Frontend image created successfully: $IMAGE_ID"
        shell: bash

      # Step 5: Verify nginx configuration
      - name: 🔍 Verify Nginx Config
        run: |
          docker run --rm \
            arizonalavka-frontend:test-${{ github.sha }} \
            nginx -t
        shell: bash

  # ===========================================================================
  # Full Stack Docker Compose Build
  # ===========================================================================
  full-stack-build:
    name: 🏗️ Full Stack Docker Compose Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-build, frontend-build]

    steps:
      # Step 1: Checkout repository
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Docker Buildx
      - name: ⚙️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Build all services with docker-compose
      - name: 🔨 Build All Services
        run: |
          docker-compose build
        shell: bash

      # Step 4: Verify all images were created
      - name: ✅ Verify All Images
        run: |
          echo "Available images:"
          docker images | grep arizonalavka

          # Check for required images
          if ! docker images | grep -q arizonalavka-backend; then
            echo "❌ Backend image missing"
            exit 1
          fi

          if ! docker images | grep -q arizonalavka-frontend; then
            echo "❌ Frontend image missing"
            exit 1
          fi

          if ! docker images | grep -q arizonalavka-postgres; then
            echo "⚠️ Postgres image not found (using pulled image)"
          fi

          echo "✅ All required images present"
        shell: bash

      # Step 5: Test docker-compose up (optional, may be flaky)
      - name: 🧪 Test Docker Compose Up (Dry Run)
        run: |
          # Just verify configuration is valid
          docker-compose config --services
          echo "✅ Docker Compose configuration is valid"
        shell: bash

  # ===========================================================================
  # Cleanup
  # ===========================================================================
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [full-stack-build]
    if: always()

    steps:
      - name: 🗑️ Remove Docker Images
        run: |
          docker rmi arizonalavka-backend:test-${{ github.sha }} || true
          docker rmi arizonalavka-frontend:test-${{ github.sha }} || true
          docker system prune -af --volumes
        shell: bash

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: 📊 Docker Build Summary
    runs-on: ubuntu-latest
    needs: [full-stack-build, cleanup]
    if: always()

    steps:
      - name: 📝 Generate Summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full Stack | ${{ needs.full-stack-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        shell: bash
