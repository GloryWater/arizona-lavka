[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "arizonalavka-backend"
dynamic = ["version"]
description = "Backend for Arizona Lavka Marketplace"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Arizona Lavka Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.1",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.25",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    "pyjwt==2.8.0",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.2",
    "httpx==0.26.0",
    "cachetools==5.3.3",
    "redis==5.2.0",
    "cryptography==42.0.0",
    "slowapi==0.1.9",
    "csrf-fastapi==0.0.6",
    "secure==0.3.0",
    "email-validator==2.1.0",
    "dnspython==2.5.0",
    "fastapi-mail==1.4.1",
    "apscheduler==3.10.4",
    "prometheus-client==0.20.0",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "flake8==7.1.1",
    "mypy==1.13.0",
    "isort==5.13.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools_scm]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
known_third_party = ["fastapi", "pydantic", "sqlalchemy", "alembic", "redis", "cryptography", "uvicorn", "httpx", "pytest", "cachetools", "apscheduler", "prometheus_client", "email_validator", "dnspython", "fastapi_mail", "python_jose", "bcrypt", "asyncpg", "python_multipart", "pyjwt", "dotenv", "secure", "slowapi", "csrf_fastapi"]
known_first_party = ["config", "models", "schemas", "routes", "services", "utils", "infrastructure", "interfaces", "dependencies", "exceptions", "error_handler", "metrics"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
ignore_missing_imports = true