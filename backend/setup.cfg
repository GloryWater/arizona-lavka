[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -ra
    -v
    --strict-markers
    --tb=short

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
known_third_party = ["fastapi", "pydantic", "sqlalchemy", "alembic", "redis", "cryptography", "uvicorn", "httpx", "pytest", "cachetools", "apscheduler", "prometheus_client", "email_validator", "dnspython", "fastapi_mail", "python_jose", "bcrypt", "asyncpg", "python_multipart", "pyjwt", "dotenv", "secure", "slowapi", "csrf_fastapi"]
known_first_party = ["config", "models", "schemas", "routes", "services", "utils", "infrastructure", "interfaces", "dependencies", "exceptions", "error_handler", "metrics"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
ignore_missing_imports = true